<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="crestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E90FF" />
      <stop offset="50%" stop-color="#0B3D91" />
      <stop offset="100%" stop-color="#061D47" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#1E90FF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Crest Shield Icon -->
  <g transform="translate(10, 10)">
    <!-- Base Shield -->
    <path d="M 40 5 L 75 18 C 75 52 58 72 40 82 C 22 72 5 52 5 18 Z" fill="url(#crestGrad)" />
    <!-- Dynamic Wing Facet 1 -->
    <path d="M 40 10 L 68 22 C 68 48 55 64 40 73 Z" fill="url(#accentGrad)" opacity="0.9" />
    <!-- Center Peak / Stylized Mountain Crest / Pen Quill -->
    <path d="M 40 15 L 52 48 L 40 42 L 28 48 Z" fill="#FFFFFF" />
    <circle cx="40" cy="56" r="3.5" fill="#FFFFFF" />
    <!-- Accent Sparkle -->
    <path d="M 40 2 L 42 7 L 47 9 L 42 11 L 40 16 L 38 11 L 33 9 L 38 7 Z" fill="#00D2FF" filter="url(#glow)" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(105, 62)">
    <text font-family="'Playfair Display', Georgia, serif" font-weight="800" font-size="44" letter-spacing="-0.5" fill="currentColor">
      Blue<tspan fill="#1E90FF">Crest</tspan>
    </text>
  </g>
  
  <!-- Subtle Tagline Indicator -->
  <g transform="translate(108, 82)">
    <text font-family="'Inter', sans-serif" font-weight="600" font-size="10.5" letter-spacing="3.5" fill="#1E90FF" opacity="0.85">
      INSIGHTS &bull; ESSENTIALS &bull; DISCOVERY
    </text>
  </g>
</svg>
